_target_: omg.data.datamodule.GenerationDataModule
limit_each_trainset: null
train_subset_ratio: null
rotation_representation: ${representation.rotation_representation}

dataset_opts:
  train:
    omg_bumi_materialized_omnimodal_train: &dataset_defaults
      _target_: omg.data.episode_cache.EpisodeCachedBumiMotionDataset
      root: ${paths.bumi_materialized_root}/omg_bumi_episode_cache_v3_omnimodal_rot6d_seq60_hist10_k1
      source_repo_id: ${oc.env:OMG_BUMI_REPO_ID,local/OMG-BUMI-Data}
      source_revision: ${oc.env:OMG_BUMI_DATA_REVISION,0000000000000000000000000000000000000000}
      kinematics_path: assets/robots/bumi/bumi_kinematics.json
      kinematics_sha256: 1b835ea62af1445c0c020ddc1ea232b89e4e7e5fe77ebad5aa88f61da60a5605
      representation_name: bumi_rot6d_93d
      split: train
  val:
    omg_bumi_materialized_omnimodal_val:
      <<: *dataset_defaults
      split: val
  test:
    omg_bumi_materialized_omnimodal_test:
      <<: *dataset_defaults
      split: test

loader_opts:
  train: {batch_size: 96, num_workers: 2, prefetch_factor: 2}
  val: {batch_size: 16, num_workers: 2, prefetch_factor: 1}
  test: {batch_size: 16, num_workers: 2, prefetch_factor: 1}
