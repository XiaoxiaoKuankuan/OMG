# @package _global_
defaults:
  - override /representation: bumi_rot6d
  - override /data: omg_bumi_materialized_omnimodal
  - override /model: motion_generator
  - override /denoiser: transformer_50m
  - override /diffusion: guided_x0
  - override /loss: full

exp_name: bumi_transformer_guided_50m_rot6d_omnimodal
init_weights_adapter: g1_to_bumi

model:
  diffusion_target: future
  use_audio: true
  use_human_motion: true
  log_loss_term_grad_norms: false
  optimizer: {lr: 6.0e-5, weight_decay: 0.01}
  scheduler:
    type: linear_warmup_cosine
    warmup_steps: 2000
    warmup_start_factor: 1.0e-4
    t_max: 100000
    eta_min: 1.0e-6

denoiser:
  input_dim: ${representation.feat_dim}
  frame_cond_injection: per_layer_film

trainer:
  max_steps: 100000
  val_check_interval: 2000
  limit_val_batches: 200

callbacks:
  checkpoint:
    every_n_train_steps: 2000
